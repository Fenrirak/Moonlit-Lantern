<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1c1b1a;--mu:#6d6a64;--ac:#3b3bd9;--on:#fff;--bd:#dcd8cf;--bad:#c23a2e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111113;--card:#1b1b1f;--tx:#f1efe9;--mu:#a09d96;--ac:#9a9aff;--on:#111113;--bd:#303036;--bad:#ff7a6e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111113;--card:#1b1b1f;--tx:#f1efe9;--mu:#a09d96;--ac:#9a9aff;--on:#111113;--bd:#303036;--bad:#ff7a6e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
body.nt{--bg:#0c0e1d;--card:#171a31;--tx:#eceaf7;--mu:#a9abca;--ac:#ffd479;--on:#1b1630;--bd:#2d3152;--bad:#ff8f84;color-scheme:dark;background:radial-gradient(120% 70% at 50% -10%,#2a2e5e 0,#0c0e1d 62%) fixed,#0c0e1d}
.app{max-width:520px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0 14px}
header b{font-size:18px;letter-spacing:-.01em}
header span{display:flex;gap:6px}
h1,h2{margin:0 0 6px;letter-spacing:-.02em;line-height:1.15}
h1{font-size:34px}h2{font-size:28px}
p{margin:0 0 14px;color:var(--mu)}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:14px;min-height:48px;padding:10px 16px;transition:transform .06s}
button:active{transform:scale(.98)}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.b{width:100%;background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600;margin-top:10px}
.s{width:100%;margin-top:10px}
.lk{min-height:40px;border-radius:999px;font-size:14px;padding:6px 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}
.big{display:block;width:100%;text-align:left;padding:22px 20px;margin-bottom:12px;border-radius:20px}
.big strong{display:block;font-size:24px;letter-spacing:-.02em}
.big span{color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.row>div:first-child{flex:1;min-width:0}
.row small{display:block;color:var(--mu);font-size:13px;line-height:1.3}
.st{display:flex;align-items:center;gap:6px}
.st button{width:44px;min-height:44px;padding:0;font-size:22px;border-radius:12px}
.st span{min-width:52px;text-align:center;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:12px 0}
.g button{overflow-wrap:anywhere}
.p.on,.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border-radius:999px}
.tg{display:inline-block;padding:3px 12px;border:1px solid var(--bd);border-radius:999px;font-size:14px}
.err{color:var(--bad);font-weight:600;margin:12px 0 0}.err:empty{display:none}
.reveal{text-align:center;padding:32px 16px}
.ic:empty{display:none}
.ic{font-size:56px;line-height:1.1;margin-bottom:6px}
.word{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:8px 0 12px;word-break:break-word}
.nm{font-size:48px}
.res{font-size:20px;color:var(--tx);font-weight:600}
.tag{color:var(--mu);font-size:14px}
.mt{margin-top:22px}
.rl{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.rl .ic{font-size:38px;margin:0}
.rl small{display:block;color:var(--mu)}
.rl b{font-size:22px}
.nl{display:flex;align-items:center;gap:8px}.nl b{min-width:20px;text-align:right;color:var(--mu)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
input:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
.timer{font-size:64px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;margin-bottom:8px}
.timer.end{color:var(--bad)}
details{margin:14px 0}summary{cursor:pointer;color:var(--mu);min-height:32px}
ol{color:var(--mu);padding-left:20px;margin:8px 0}li{margin-bottom:6px}
main:focus{outline:none}
@media(prefers-reduced-motion:no-preference){main.fi>*{animation:fi .28s ease both}}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
footer{margin-top:36px;padding:28px 0 8px;border-top:1px solid var(--bd);text-align:center}
footer:empty{display:none}
.fb{font:600 26px Georgia,"Times New Roman",serif;color:var(--ac);margin-bottom:8px}
.fn{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 8px;margin-bottom:10px}
.fn a,.fn button{background:none;border:0;color:var(--tx);font-weight:600;font-size:16px;min-height:44px;padding:8px 14px;border-radius:10px;text-decoration:none;display:inline-flex;align-items:center}
.fn a:hover,.fn button:hover{color:var(--ac)}
.fn a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.fc{font-size:14px;color:var(--mu);margin:0}
.lbs{display:grid;gap:10px;margin-top:16px}
.lb{display:flex;align-items:center;justify-content:center;min-height:52px;padding:10px 16px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font-weight:600;text-decoration:none;transition:transform .06s}
.lb:active{transform:scale(.98)}
.lb:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.lb.ac{background:var(--ac);color:var(--on);border-color:var(--ac)}
.ab p{font-size:18px;line-height:1.65;color:var(--tx)}.ab p:last-child{margin:0}
.doc h3{font-size:18px;margin:24px 0 6px;letter-spacing:-.01em}
.doc p,.doc li{color:var(--tx);line-height:1.6}.doc ul{padding-left:20px;margin:6px 0 14px}
</style>
</head>
<body>
<div class="app">
<header id="hd"></header>
<main id="m" tabindex="-1"></main>
<footer id="ft"></footer>
</div>
<script>
const $=id=>document.getElementById(id),rnd=n=>Math.floor(Math.random()*n),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const lst=a=>a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const RK=['mafia','doctor','sheriff','crazy','cupid'];
const RN={mafia:'Mafia',doctor:'Doctor',crazy:'Crazy Doctor',sheriff:'Sheriff',cupid:'Cupid',innocent:'Innocent'};
const RI={mafia:'',doctor:'',crazy:'',sheriff:'',cupid:'',innocent:''};
const RD={mafia:'Each night every mafia member kills one player of their own choosing. Stay hidden.',doctor:'Each night you save one player from the mafia. You may save yourself.',crazy:'Each night you give one player a tea and choose if it is good (protects them) or bad (kills them). A doctor can block a bad tea.',sheriff:'Each night you investigate one player and learn if they are mafia.',cupid:'On the first night you link two players as lovers. If one dies, the other dies too.',innocent:'You have no ability. Work out who the mafia are and vote them out.'};
const RDD='Each night the doctors save one player. Every doctor chooses a target and the most chosen one is saved. You may save yourself.';
const RDM='Each night the mafia kill one player. Every member chooses a target and the most chosen one dies. Stay hidden.';
const TASK={cupid:'Choose the two players who will fall in love. Nobody else will be told, so keep it secret.',mafia:'Choose one player to kill.',doctor:'Choose one player to save. You may save yourself.',crazy:'Choose one player to give a tea to, then decide if it is good or bad.',sheriff:'Choose one player to investigate.'};
const DECOY='You have no power tonight. Tap anyone anyway, so nobody can tell who has a power.';
const GN={nz:'NZ common facts',obj:'Objects',food:'Foods',ani:'Animals',pla:'Places'};
const W={
nz:['Haka|Dance','Pavlova|Dessert','Kiwi|Bird','Rotorua|Geothermal','Hokey Pokey|Crunchy','Jandals|Footwear','Pōhutukawa|Tree','Waitangi|Treaty','Mount Cook|Peak','Hāngī|Feast','All Blacks|Team','Sauvignon Blanc|Vineyard','Fiordland|Scenery','Tūī|Singer','Bungy|Jump','Marmite|Spread'],
obj:['Umbrella|Rain','Scissors|Cut','Toothbrush|Morning','Backpack|Carry','Candle|Flame','Mirror|Reflection','Kettle|Boil','Clock|Time','Ladder|Climb','Pillow|Soft','Wallet|Money','Key|Lock','Headphones|Music','Lamp|Light','Stapler|Paper','Suitcase|Travel'],
food:['Pizza|Slice','Sushi|Rice','Pancakes|Breakfast','Banana|Yellow','Chocolate|Sweet','Popcorn|Cinema','Spaghetti|Italian','Burger|Bun','Avocado|Green','Curry|Spicy','Cheese|Dairy','Watermelon|Summer','Fries|Salty','Dumplings|Folded','Ice cream|Cold','Toast|Crunchy'],
ani:['Elephant|Large','Penguin|Cold','Giraffe|Tall','Octopus|Ocean','Kangaroo|Australia','Owl|Night','Dolphin|Smart','Bat|Flying','Shark|Teeth','Camel|Desert','Koala|Sleepy','Hedgehog|Spiky','Rabbit|Fluffy','Frog|Pond','Tiger|Stripes','Horse|Ride'],
pla:['Airport|Travel','Library|Quiet','Beach|Sand','Hospital|Doctors','School|Learning','Supermarket|Shopping','Zoo|Visit','Cinema|Dark','Museum|History','Bakery|Smell','Gym|Sweat','Farm|Rural','Lighthouse|Coast','Castle|Old','Volcano|Hot','Playground|Kids']};
const VOK=!!window.speechSynthesis;
function rec(p){const m=Math.max(1,Math.min(Math.round(p/4),Math.ceil(p/2)-1));return{mafia:m,doctor:p>=3?Math.max(1,Math.round(p/6)):0,sheriff:p>=5?Math.max(1,Math.round(p/6)):0,cupid:p>=6?1:0,crazy:p>=5?1:0}}
let view='home',Q=0,NM=[],M={p:5,c:rec(5),mf:1,mk:0,dh:0,sv:1,rv:0,tm:3,vo:1},I={p:5,g:{nz:1,obj:1,food:1,ani:1,pla:1},h:1,used:[]},G={},SV=null,lastNav=0,navf=0,WL=null,AC=null;
const pn=i=>(NM[i]||'').trim()||'Player '+(i+1);
const names=p=>Array.from({length:p},(_,i)=>pn(i));
const dupe=p=>new Set(names(p).map(n=>n.toLowerCase())).size<p;
const E=i=>esc(G.nm[i]);
const store=()=>{try{localStorage.setItem('ml-s',JSON.stringify({NM,M,I}));if(view=='mg'||view=='ig')localStorage.setItem('ml-g',JSON.stringify({view,G}))}catch(e){}};
try{const s=JSON.parse(localStorage.getItem('ml-s')||'null');if(s){NM=Array.isArray(s.NM)?s.NM:[];if(s.M)Object.assign(M,s.M);if(s.I)Object.assign(I,s.I);if(M.c){if(M.c.officer!=null){M.c.sheriff=M.c.officer;delete M.c.officer}if(M.c.sheriff==null)M.c.sheriff=0}}
const g=JSON.parse(localStorage.getItem('ml-g')||'null');if(g&&g.G&&g.G.roles)g.G.roles=g.G.roles.map(x=>x=='officer'?'sheriff':x);if(g&&g.G&&g.G.ph&&(g.view=='mg'||g.view=='ig'))SV=g;
const t=localStorage.getItem('pg-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
const dk=()=>{const t=document.documentElement.dataset.theme;return t?t=='dark':!!(window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)};
/* ---------- phone-as-host helpers: voice, alarm, wake lock ---------- */
const say=t=>{try{if(!VOK||!G||!G.cfg||!G.cfg.vo)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.95;speechSynthesis.speak(u)}catch(e){}};
const ac=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}};

const task=r=>r=='doctor'&&G.cfg.dh?'Choose one player to save. If several doctors choose differently, the most chosen player is saved. You may save yourself.':r=='mafia'&&G.cfg.mk?'Choose who to kill. If several mafia choose differently, the most chosen target dies.':TASK[r];
const prior=(p,r)=>{const L=G.lp,o=[];if(L.t!='night'||!['doctor','crazy','sheriff'].includes(r))return o;for(let j=0;j<L.k;j++){const q=L.o[j],a=G.acts[q];if(G.roles[q]!=r||!a)continue;const w=G.nm[q],t=G.nm[a.t[0]];o.push(r=='sheriff'?w+' investigated '+t+': '+(G.roles[a.t[0]]=='mafia'?'mafia.':'not mafia.'):r=='doctor'?w+' is saving '+t+'.':w+' gave '+t+' a '+(a.g?'good':'bad')+' tea.')}return o};
const top1=a=>{if(a.length<2)return a;const c={};a.forEach(t=>c[t]=(c[t]||0)+1);const mx=Math.max(...Object.values(c)),tp=Object.keys(c).filter(t=>c[t]==mx);return[+tp[rnd(tp.length)]]};
const lap=(t,o)=>{G.ph='lap';G.lp={t,o:o||alive(),k:0,s:'hand',sel:[],tea:null,r:null}};
function chain(k){const x=[];let c=1;while(c){c=0;G.lv.forEach(([a,b])=>{[[a,b],[b,a]].forEach(([u,v])=>{if((k.has(u)||x.includes(u))&&!k.has(v)&&!x.includes(v)&&G.alive[v]){x.push(v);c=1}})})}return x}
function die(k){const x=chain(k);[...k,...x].forEach(i=>G.alive[i]=0);return x}
function chk(){let m=0,o=0;G.roles.forEach((r,i)=>{if(G.alive[i])r=='mafia'?m++:o++});return m==0?'Town wins':m>=o?'Mafia wins':''}
